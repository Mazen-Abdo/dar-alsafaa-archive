<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="نظام دار الصفاء الذكي - الأرشيف الإلكتروني والرقابة المؤسسية" />
    <title>دار الصفاء الذكية — نظام الأرشيف</title>

    <!--
      Anti-FOUC (Flash Of Unstyled Content) script.
      Runs SYNCHRONOUSLY before React loads → reads saved theme
      and applies .dark class immediately so there's no white flash.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('daralsafaa_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
