<script>
        // Simple script to update percentage to match progress bar animation
        document.addEventListener("DOMContentLoaded", () => {
            const percentEl = document.getElementById('loading-percent');
            let progress = 0;
            const duration = 2500; // ms
            const intervalTime = 50;
            const steps = duration / intervalTime;
            const increment = 100 / steps;

            const interval = setInterval(() => {
                progress += increment;
                // Add some non-linear feeling to the text counter to loosely match cubic-bezier
                let displayVal = Math.floor(progress);
                if (displayVal > 100) displayVal = 100;
                
                percentEl.textContent = displayVal + '%';

                if (progress >= 100) {
                    clearInterval(interval);
                    percentEl.textContent = '100%';
                    // Optional: trigger navigation or reveal after load
                    setTimeout(() => {
                         percentEl.textContent = 'جاهز';
                    }, 500);
                }
            }, intervalTime);
        });
    </script>
